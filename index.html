<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<title>Rutina 12 semanas</title>
<meta name="description" content="Rutina de fuerza y cardio en casa de 12 semanas, con animaciones de cada ejercicio.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rutina">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#0f1216; --card:#171b21; --card2:#1d222a; --ink:#eef2f6; --muted:#98a2b0;
  --line:#272e38; --acc:#ff7a45; --acc-soft:rgba(255,122,69,.14);
  --cardio:#2dd4bf; --cardio-soft:rgba(45,212,191,.13);
  --warn:#fbbf24; --warn-soft:rgba(251,191,36,.12);
  --fig:#e8edf3; --fig-far:#6c7686; --fig-eq:#ff7a45; --fig-floor:#3a434f;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.25);
  --r:16px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f5f8; --card:#ffffff; --card2:#f7f9fb; --ink:#141920; --muted:#5d6672;
    --line:#e3e8ee; --acc:#e2561f; --acc-soft:rgba(226,86,31,.1);
    --cardio:#0d9488; --cardio-soft:rgba(13,148,136,.1);
    --warn:#b45309; --warn-soft:rgba(180,83,9,.1);
    --fig:#2b3440; --fig-far:#a9b3c0; --fig-eq:#e2561f; --fig-floor:#cfd6de;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 6px 18px rgba(16,24,40,.07);
  }
}
:root[data-theme="light"]{
  --bg:#f3f5f8; --card:#ffffff; --card2:#f7f9fb; --ink:#141920; --muted:#5d6672;
  --line:#e3e8ee; --acc:#e2561f; --acc-soft:rgba(226,86,31,.1);
  --cardio:#0d9488; --cardio-soft:rgba(13,148,136,.1);
  --warn:#b45309; --warn-soft:rgba(180,83,9,.1);
  --fig:#2b3440; --fig-far:#a9b3c0; --fig-eq:#e2561f; --fig-floor:#cfd6de;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 6px 18px rgba(16,24,40,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
.wrap{max-width:660px;margin:0 auto;padding:0 14px}
h1,h2,h3{margin:0;line-height:1.25;letter-spacing:-.01em}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.topbar .wrap{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
.brand h1{font-size:17px;font-weight:700}
.brand p{margin:1px 0 0;font-size:12.5px;color:var(--muted)}
.iconbtn{margin-left:auto;flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:17px;display:grid;place-items:center;cursor:pointer}

/* ---------- strips ---------- */
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 14px;margin:0 -14px;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.pill{flex:none;scroll-snap-align:center;border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:999px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:40px}
.pill[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:14px}
.day{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:13px;padding:8px 0 7px;
  cursor:pointer;text-align:center;position:relative;min-height:52px}
.day b{display:block;font-size:14px;font-weight:700;color:inherit}
.day small{display:block;font-size:9.5px;margin-top:2px;opacity:.75;padding:0 2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.day.today:after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:5px;width:4px;height:4px;
  border-radius:50%;background:var(--acc)}
.day[aria-pressed="true"].today:after{background:#fff}
.day.rest{opacity:.62}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.sess{padding:15px 15px 13px}
.sess .kicker{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--acc)}
.sess h2{font-size:21px;margin-top:3px}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.tag{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.tag.acc{background:var(--acc-soft);color:var(--acc);border-color:transparent}
.tag.cardio{background:var(--cardio-soft);color:var(--cardio);border-color:transparent}
.sec-title{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 0 9px;padding:0 2px}

/* ---------- exercise ---------- */
.ex{border:1px solid var(--line);background:var(--card);border-radius:var(--r);margin-bottom:9px;box-shadow:var(--shadow);overflow:hidden}
.ex>summary{display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer;list-style:none;min-height:66px}
.ex>summary::-webkit-details-marker{display:none}
.fig{flex:none;width:84px;height:66px;border-radius:11px;background:var(--card2);border:1px solid var(--line)}
.fig svg{display:block;width:100%;height:100%}
.ex .txt{flex:1;min-width:0}
.ex .txt h3{font-size:15.5px;font-weight:650}
.ex .dose{font-size:13.5px;color:var(--acc);font-weight:650;margin-top:2px}
.ex .goal{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{flex:none;color:var(--muted);transition:transform .18s ease;font-size:13px}
.ex[open] .chev{transform:rotate(90deg)}
.ex .body{padding:2px 14px 14px;border-top:1px solid var(--line);margin-top:2px}
.bigfig{width:100%;height:180px;background:var(--card2);border:1px solid var(--line);border-radius:12px;margin:12px 0}
.bigfig svg{display:block;width:100%;height:100%}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 7px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding:0 0 0 27px;margin-bottom:7px;font-size:14.5px;counter-increment:s}
.steps li:before{content:counter(s);position:absolute;left:0;top:1px;width:19px;height:19px;border-radius:6px;
  background:var(--acc-soft);color:var(--acc);font-size:11px;font-weight:700;display:grid;place-items:center}
.alt{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:7px}
.alt b{display:block;font-size:14px}
.alt span{font-size:13.5px;color:var(--muted)}
.vid{display:inline-flex;align-items:center;gap:7px;margin-top:12px;font-size:13.5px;font-weight:600;
  color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--card2);padding:9px 13px;border-radius:11px}

/* ---------- notes ---------- */
.note{border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-size:14px;border:1px solid transparent}
.note.cardio{background:var(--cardio-soft);border-color:var(--cardio-soft);border-color:color-mix(in srgb,var(--cardio) 28%,transparent)}
.note.warn{background:var(--warn-soft);border-color:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.note b{display:block;margin-bottom:4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.note.cardio b{color:var(--cardio)} .note.warn b{color:var(--warn)}
.note ul{margin:6px 0 0;padding-left:18px} .note li{margin-bottom:4px}
.rest-msg{text-align:center;padding:30px 18px;color:var(--muted)}
.rest-msg .big{font-size:40px;margin-bottom:8px}

/* ---------- lists ---------- */
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;font-size:14.5px;padding:9px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list li:before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--acc);margin-top:8px}
.list.plain li:before{display:none}
.kv{display:grid;grid-template-columns:minmax(92px,45%) 1fr;gap:14px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)} .kv b{font-weight:650;text-align:right}
.pad{padding:14px 15px}
.block-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.block-row:last-child{border-bottom:0}
.block-row .t{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;color:var(--cardio);font-size:14px}
.search{width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font-size:16px;margin-bottom:12px}
.search::placeholder{color:var(--muted)}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);display:flex}
.tabbar .inner{max-width:660px;margin:0 auto;width:100%;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;color:var(--muted);padding:9px 0 8px;font-size:11px;font-weight:600;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;justify-content:center}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--acc)}
.view[hidden]{display:none}
.noscript{margin:18px 14px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--card);max-width:620px;margin-left:auto;margin-right:auto}
.noscript h2{font-size:17px;margin-bottom:8px}
.noscript p{margin:0 0 8px;font-size:14.5px;color:var(--muted)}
.noscript ol{margin:0;padding-left:20px;font-size:14.5px}
.noscript li{margin-bottom:5px}
.noscript b{color:var(--ink)}
/* ---------- bloques y superseries ---------- */
.group{border:1px solid color-mix(in srgb,var(--acc) 30%,var(--line));border-radius:var(--r);
  background:var(--acc-soft);padding:8px;margin-bottom:12px}
.group .ex{margin-bottom:8px}
.group .ex:last-child{margin-bottom:0}
.grouphdr{padding:4px 6px 9px}
.grouphdr b{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.grouphdr span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.blocktag{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.enfoque{margin:11px 0 0;font-size:14px;color:var(--muted)}
.ex .dose.cardio{color:var(--cardio)}
.tag.hombro-alta{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.hombro-baja,.tag.hombro-ninguna{background:var(--card2);color:var(--muted)}

/* ---------- paneles plegables (fase, calentamiento) ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  margin-bottom:12px;overflow:hidden}
.panel>summary{display:flex;align-items:center;gap:10px;padding:13px 15px;cursor:pointer;list-style:none;min-height:56px}
.panel>summary::-webkit-details-marker{display:none}
.panel>summary b{font-size:14.5px;font-weight:650}
.panel>summary .mini{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.panel>summary>b{flex:1;min-width:0}
.panel[open] .chev{transform:rotate(90deg)}
.panel .body{padding:2px 15px 14px;border-top:1px solid var(--line)}
.panel>summary>*:first-child{flex:1;min-width:0}

/* ---------- fichas de cardio ---------- */
.phase-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.phase-row:last-child{border-bottom:0}
.phase-row b{flex:none;width:74px;font-size:12.5px;color:var(--muted)}
.phase-row.on{background:var(--cardio-soft);border-radius:9px;padding:8px;margin:0 -8px}
.phase-row.on b{color:var(--cardio)}
.card2box{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:2px 12px;margin-top:12px}

/* ---------- tabla de proyección ---------- */
.table{margin-top:4px}
.trow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:8px 6px;border-bottom:1px solid var(--line);
  font-size:14px;font-variant-numeric:tabular-nums}
.trow:last-child{border-bottom:0}
.trow.th{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.trow.on{background:var(--acc-soft);border-radius:9px}
.trow span:first-child{color:var(--muted)}
.change{padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.change:last-child{border-bottom:0}
.change s{display:block;font-size:13px;color:var(--muted)}
.small{font-size:12.5px;color:var(--muted);margin-top:10px}
.list.warn li:before{background:var(--warn)}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:22px 10px 8px}
@media (min-width:560px){ .fig{width:104px;height:78px} .ex>summary{min-height:78px} }
</style>
</head>

<header class="topbar">
  <div class="wrap">
    <div class="brand">

<main class="wrap">

  <section class="view" id="view-ejercicios" hidden>

    <div id="catalogWrap"></div>
  </section>

  <section class="view" id="view-cardio" hidden>
    <div style="height:14px"></div>
    <div id="cardioWrap"></div>
  </section>

  <section class="view" id="view-guia" hidden>
    <div style="height:14px"></div>
    <div id="guiaWrap"></div>

  <p class="foot" id="foot"></p>
</main>

<nav class="tabbar">
  <div class="inner">

    <button class="tab" data-view="ejercicios" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M4 9v6M7.5 7v10M16.5 7v10M20 9v6M7.5 12h9"/></svg>Ejercicios</button>
    <button class="tab" data-view="cardio" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M3 12.5h4l2-4.5 3 9 2.5-6 1.5 3h5"/></svg>Cardio</button>
    <button class="tab" data-view="guia" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-7.5-10A4.5 4.5 0 0 1 12 8.2 4.5 4.5 0 0 1 19.5 11c0 5.4-7.5 10-7.5 10z"/></svg>Guía</button>
  </div>
</nav>

function fitBox(seq, def){
  let x0=1e9, x1=-1e9, y0=1e9, y1=-1e9;
  const put = p => { x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]); y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]); };
  for(let i=0; i<seq.length-1; i++){
    for(let s=0; s<=6; s++){
      const p = solve(lerpFrame(seq[i], seq[i+1], s/6));
      const pts = (def.focus === 'upper') ? [p.hip, p.sh].concat(p.armN, p.armF)
                                          : [p.hip, p.sh].concat(p.legN, p.legF, p.armN, p.armF);
      pts.forEach(put);
      put([p.head[0]-9, p.head[1]-9]); put([p.head[0]+9, p.head[1]+9]);
    }
  }
  if(def.bench){
    (def.bench.pads || []).forEach(p => { put([p[0], p[1]]); put([p[2], p[3]]); });
    (def.bench.posts || []).forEach(p => { put([p[0], p[1]]); put([p[0], 148]); });
  }
  if(def.bag){ put([def.bag.x, def.bag.y0]); put([def.bag.x+def.bag.w, def.bag.y1]); }
  x0-=11; x1+=11; y0-=11; y1+=11;
  if(y1 > 130) y1 = Math.max(y1, 154);          // deja ver el suelo
  let w = x1-x0, h = y1-y0;
  const AR = 1.25;                               // proporcion del recuadro
  if(w/h < AR){ const nw = h*AR; x0 -= (nw-w)/2; w = nw; }
  else { const nh = w/AR; y0 -= (nh-h)/2; h = nh; }
  if(w < 120){ const k = (120-w)/2; x0 -= k; w = 120; y0 -= k/AR; h = 120/AR; }
  return [x0.toFixed(1), y0.toFixed(1), w.toFixed(1), h.toFixed(1)].join(' ');
}

function buildFigure(key, big){
  const def = ANIM[key] || ANIM.generic;
  const frames = def.frames.map(f => normFrame(
    Object.assign({ax:def.ax, ay:def.ay}, f), def.anchor
  ));
  const seq = (def.loop === 'cycle') ? frames.concat([frames[0]])
                                     : frames.concat(frames.slice(0,-1).reverse());
  const svg = el('svg', {viewBox:fitBox(seq, def), 'aria-hidden':'true'});
  const g = el('g', {fill:'none', 'stroke-linecap':'round', 'stroke-linejoin':'round'});
  svg.appendChild(g);

  // suelo
  g.appendChild(el('line', {x1:-60, y1:148, x2:260, y2:148, stroke:'var(--fig-floor)', 'stroke-width':2.5}));
  // banco
  if(def.bench){
    (def.bench.posts || []).forEach(p => {
      g.appendChild(el('line', {x1:p[0], y1:p[1], x2:p[0], y2:148, stroke:'var(--fig-eq)', 'stroke-width':2.5, opacity:.45}));
    });
    (def.bench.pads || []).forEach(p => {
      g.appendChild(el('line', {x1:p[0], y1:p[1], x2:p[2], y2:p[3], stroke:'var(--fig-eq)',
        'stroke-width':7, 'stroke-linecap':'round', opacity:.32}));
    });
  }
  // saco
  if(def.bag){
    const b = def.bag;
    g.appendChild(el('line', {x1:b.x+b.w/2, y1:8, x2:b.x+b.w/2, y2:b.y0, stroke:'var(--fig-eq)', 'stroke-width':2, opacity:.5}));
    g.appendChild(el('rect', {x:b.x, y:b.y0, width:b.w, height:b.y1-b.y0, rx:11, fill:'var(--fig-eq)', opacity:.3, stroke:'none'}));
  }

  const mk = (stroke, w, op) => { const p = el('polyline', {stroke:stroke, 'stroke-width':w, opacity:op||1}); g.appendChild(p); return p; };
  const parts = {};
  parts.legF = mk('var(--fig-far)', 5);
  parts.armF = mk('var(--fig-far)', 4.5);
  parts.torso = mk('var(--fig)', 6.5);
  parts.head = el('circle', {r:7.5, fill:'var(--fig)', stroke:'none'}); g.appendChild(parts.head);
  parts.legN = mk('var(--fig)', 5.5);
  parts.armN = mk('var(--fig)', 5);
  parts.w = el('g', {}); g.appendChild(parts.w);

  const fig = {svg:svg, parts:parts, seq:seq, dur:def.dur || 1300, hands:def.hands || 'none', visible:false};
  draw(fig, seq[0]);
  figures.push(fig);
  const box = document.createElement('div');
  box.className = big ? 'bigfig' : 'fig';
  box.appendChild(svg);
  io.observe(box);
  fig.box = box;
  return box;
}

function poly(p, pts){ p.setAttribute('points', pts.map(a => a[0].toFixed(1)+','+a[1].toFixed(1)).join(' ')); }

function weight(kind, p){
  const out = [];
  if(kind === 'goblet'){ out.push(el('circle', {cx:p[0], cy:p[1], r:8, fill:'var(--fig-eq)', opacity:.85})); }
  else if(kind === 'vert'){
    out.push(el('rect', {x:p[0]-3, y:p[1]-9, width:6, height:18, rx:2, fill:'var(--fig-eq)', opacity:.35}));
    out.push(el('circle', {cx:p[0], cy:p[1]-8, r:4.5, fill:'var(--fig-eq)'}));
    out.push(el('circle', {cx:p[0], cy:p[1]+8, r:4.5, fill:'var(--fig-eq)'}));
  } else if(kind === 'plate'){
    out.push(el('circle', {cx:p[0], cy:p[1], r:8, fill:'var(--fig-eq)', opacity:.85}));
    out.push(el('circle', {cx:p[0], cy:p[1], r:3, fill:'var(--card2)'}));
  } else {
    out.push(el('circle', {cx:p[0], cy:p[1], r:6, fill:'var(--fig-eq)', opacity:.9}));
  }
  return out;
}

function draw(fig, frame){
  const s = solve(frame);
  poly(fig.parts.legF, s.legF);
  poly(fig.parts.armF, s.armF);
  poly(fig.parts.torso, [s.hip, s.sh]);
  fig.parts.head.setAttribute('cx', s.head[0].toFixed(1));
  fig.parts.head.setAttribute('cy', s.head[1].toFixed(1));
  poly(fig.parts.legN, s.legN);
  poly(fig.parts.armN, s.armN);
  const w = fig.parts.w;
  while(w.firstChild) w.removeChild(w.firstChild);
  if(fig.hands === 'hip-plate'){
    weight('plate', s.hip).forEach(n => w.appendChild(n));
  } else if(fig.hands !== 'none'){
    const kind = fig.hands === 'near-disc' ? 'disc' : fig.hands;
    if(fig.hands !== 'near-disc' && fig.hands !== 'goblet') weight(kind, s.armF[2]).forEach(n => w.appendChild(n));
    weight(kind, s.armN[2]).forEach(n => w.appendChild(n));
  }
}

const io = new IntersectionObserver(es => {
  es.forEach(e => { const f = figures.find(x => x.box === e.target); if(f) f.visible = e.isIntersecting; });
}, {rootMargin:'40px'});

let last = 0;
function tick(now){
  requestAnimationFrame(tick);
  if(now - last < 33) return;
  last = now;
  for(const f of figures){
    if(!f.visible) continue;
    const total = f.dur * (f.seq.length - 1);
    const t = reduceMotion ? f.dur * 0.5 : (now % total);
    const i = Math.min(Math.floor(t / f.dur), f.seq.length - 2);
    const lt = t / f.dur - i;
    const e = lt < .5 ? 2*lt*lt : 1 - Math.pow(-2*lt + 2, 2)/2;
    draw(f, lerpFrame(f.seq[i], f.seq[i+1], e));
  }
}
requestAnimationFrame(tick);

const DAYS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const SHORT = ['LUN','MAR','MIÉ','JUE','VIE','SÁB','DOM'];
const CAT = D.catalogo_ejercicios_fuerza;
const FASES = D.programacion.fases;
const SEMANA = D.programacion.semana_tipo;
const WEEKS = D.perfil.duracion_semanas;

/* Semana -> fase, leyendo el rango "1-2" / "3-5" del propio JSON. */
function faseFor(w){
  for(const f of FASES){
    const m = String(f.semanas).match(/(\d+)\s*[-–]\s*(\d+)/);
    if(m){ if(w >= +m[1] && w <= +m[2]) return f; }
    else if(String(f.semanas).trim() === String(w)) return f;
  }
  return FASES[FASES.length - 1];
}

function h(tag, cls, txt){ const e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; }
function ul(items, cls){ const l = h('ul', cls || 'list'); (items || []).forEach(x => l.appendChild(h('li', null, x))); return l; }
function kvRow(parent, k, v){ const r = h('div','kv'); r.appendChild(h('span', null, k)); r.appendChild(h('b', null, v)); parent.appendChild(r); return r; }
function note(cls, title, txt){
  const n = h('div','note ' + cls);
  if(title) n.appendChild(h('b', null, title));
  if(txt) n.appendChild(document.createTextNode(txt));
  return n;
}

/* Preferencias de interfaz. En file:// algunos navegadores bloquean el
   almacenamiento, asi que cualquier fallo se ignora en silencio. */
const store = {
  get: function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set: function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

let week = Math.min(WEEKS, Math.max(1, parseInt(store.get('rutina-week'), 10) || 1));
let day = (new Date().getDay() + 6) % 7;
const todayIdx = day;

/* ---------- ficha de ejercicio ---------- */
function exerciseCard(key, dose, titulo, etiqueta){
  const ex = CAT[key];
  const d = document.createElement('details');
  d.className = 'ex';
  const sum = document.createElement('summary');
  sum.appendChild(buildFigure(key, false));
  const txt = h('div','txt');
  if(etiqueta) txt.appendChild(h('div','blocktag', etiqueta));
  txt.appendChild(h('h3', null, ex ? ex.nombre : key));
  if(dose) txt.appendChild(h('div','dose', dose));
  if(ex) txt.appendChild(h('div','goal', ex.grupo + ' · ' + ex.objetivo));
  sum.appendChild(txt);
  sum.appendChild(h('div','chev','❯'));
  d.appendChild(sum);

  const body = h('div','body');
  if(ex){
    body.appendChild(buildFigure(key, true));
    if(titulo) body.appendChild(note('cardio', 'En este bloque', titulo));
    const info = h('div','card2box');
    kvRow(info, 'Series y reps base', ex.series_reps_base);
    if(ex.carga_orientativa) kvRow(info, 'Carga orientativa', ex.carga_orientativa);
    body.appendChild(info);
    body.appendChild(h('div','lbl','Técnica'));
    const ol = h('ol','steps');
    ex.tecnica.forEach(t => ol.appendChild(h('li', null, t)));
    body.appendChild(ol);
    if(ex.alternativas && ex.alternativas.length){
      body.appendChild(h('div','lbl','Alternativas'));
      ex.alternativas.forEach(a => {
        const c = h('div','alt');
        c.appendChild(h('b', null, a.nombre));
        c.appendChild(h('span', null, a.como));
        body.appendChild(c);
      });
    }
    const a = document.createElement('a');
    a.className = 'vid';
    a.href = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(ex.nombre + ' técnica ejercicio');
    a.target = '_blank'; a.rel = 'noopener';
    a.textContent = '▶  Buscar video (necesita internet)';
    body.appendChild(a);
  }
  d.appendChild(body);
  return d;
}

/* ---------- ficha de un formato de cardio ---------- */
function cardioCard(key, dose, etiqueta, faseId, compact){
  const c = D.cardio[key];
  if(!c) return h('div','card pad', key);
  const d = document.createElement('details');
  d.className = 'ex cardio';
  const sum = document.createElement('summary');
  sum.appendChild(buildFigure(key, false));
  const txt = h('div','txt');
  if(etiqueta) txt.appendChild(h('div','blocktag', etiqueta));
  txt.appendChild(h('h3', null, c.nombre));
  if(dose) txt.appendChild(h('div','dose cardio', dose));
  sum.appendChild(txt);
  sum.appendChild(h('div','chev','❯'));
  d.appendChild(sum);

  const body = h('div','body');
  if(!compact) body.appendChild(buildFigure(key, true));
  if(c.como){ body.appendChild(h('div','lbl','Cómo se hace')); body.appendChild(h('div', null, c.como)); }
  body.appendChild(h('div','lbl','Por fase'));
  FASES.forEach(f => {
    if(!c[f.id]) return;
    const r = h('div','phase-row' + (f.id === faseId ? ' on' : ''));
    r.appendChild(h('b', null, f.nombre.replace(/ - .*/, '')));
    r.appendChild(h('span', null, c[f.id]));
    body.appendChild(r);
  });
  if(c.reglas){ body.appendChild(h('div','lbl','Reglas')); body.appendChild(ul(c.reglas)); }
  d.appendChild(body);
  return d;
}

/* ---------- selectores de semana y día ---------- */
function renderStrips(){
  const ws = document.getElementById('weekStrip');
  ws.innerHTML = '';
  for(let w = 1; w <= WEEKS; w++){
    const b = h('button','pill','Semana ' + w);
    b.setAttribute('aria-pressed', w === week);
    b.onclick = () => {
      week = w; store.set('rutina-week', w);
      renderStrips(); renderSession();
      document.querySelectorAll('#weekStrip .pill')[w-1].scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
    };
    ws.appendChild(b);
  }
  const ds = document.getElementById('dayStrip');
  ds.innerHTML = '';
  SEMANA.forEach((s, i) => {
    const b = h('button','day');
    b.appendChild(h('b', null, SHORT[i]));
    b.appendChild(h('small', null, s.sesion));
    if(i === todayIdx) b.classList.add('today');
    if(!s.bloques || !s.bloques.length) b.classList.add('rest');
    b.setAttribute('aria-pressed', i === day);
    b.onclick = () => { day = i; renderStrips(); renderSession(); };
    ds.appendChild(b);
  });
}

/* ---------- sesión del día ---------- */
function renderSession(){
  const fase = faseFor(week);
  const faseId = fase.id;
  const s = SEMANA[day];
  const wrap = document.getElementById('sessionWrap');
  wrap.innerHTML = '';
  document.getElementById('hdrSub').textContent = fase.nombre;

  const card = h('div','card sess');
  card.appendChild(h('div','kicker', DAYS[day] + (day === todayIdx ? ' · hoy' : '') + ' · semana ' + week));
  card.appendChild(h('h2', null, s.sesion));
  const meta = h('div','meta');
  const dur = s.duracion_estimada_min && s.duracion_estimada_min[faseId];
  if(dur) meta.appendChild(h('span','tag acc', dur + ' min'));
  if(s.fuerza_estimada_min && s.fuerza_estimada_min[faseId]) meta.appendChild(h('span','tag', s.fuerza_estimada_min[faseId] + ' min de fuerza'));
  if(s.carga_hombro) meta.appendChild(h('span','tag hombro-' + s.carga_hombro, 'hombro: ' + s.carga_hombro));
  (s.modos_kit || []).forEach(m => meta.appendChild(h('span','tag', m)));
  card.appendChild(meta);
  if(s.enfoque) card.appendChild(h('p','enfoque', s.enfoque));
  wrap.appendChild(card);

  /* fase actual */
  const fd = document.createElement('details');
  fd.className = 'panel';
  const fs = document.createElement('summary');
  fs.appendChild(h('b', null, fase.nombre));
  fs.appendChild(h('span','mini', 'semanas ' + fase.semanas + ' · RIR ' + fase.rir + ' · descanso ' + fase.descanso_s + ' s'));
  fs.appendChild(h('div','chev','❯'));
  fd.appendChild(fs);
  const fb = h('div','body');
  kvRow(fb, 'Series', fase.series);
  kvRow(fb, 'RIR (reps en reserva)', fase.rir);
  kvRow(fb, 'Descanso', fase.descanso_s + ' s');
  if(fase.claves){ fb.appendChild(h('div','lbl','Claves de la fase')); fb.appendChild(ul(fase.claves)); }
  fd.appendChild(fb);
  wrap.appendChild(fd);

  if(!s.bloques || !s.bloques.length){
    const r = h('div','card');
    const m = h('div','rest-msg');
    m.appendChild(h('div','big', /descanso/i.test(s.sesion) ? '🛌' : '🚶'));
    m.appendChild(h('div', null, s.enfoque || 'Sin sesión estructurada.'));
    r.appendChild(m);
    wrap.appendChild(r);
    return;
  }

  /* calentamiento */
  const cal = D.calentamiento_estandar;
  const cd = document.createElement('details');
  cd.className = 'panel';
  const cs = document.createElement('summary');
  cs.appendChild(h('b', null, 'Calentamiento + protocolo de hombro'));
  cs.appendChild(h('span','mini', cal.duracion_min + ' min · antes de empezar'));
  cs.appendChild(h('div','chev','❯'));
  cd.appendChild(cs);
  const cb = h('div','body');
  cal.movimientos.forEach(m => {
    const r = h('div','block-row');
    r.appendChild(h('span', null, m.movimiento));
    r.appendChild(h('span','t', m.cantidad));
    cb.appendChild(r);
  });
  cd.appendChild(cb);
  wrap.appendChild(cd);

  /* bloques, agrupados en superseries por la letra (A1 + A2 = superserie A) */
  const soloFuerza = s.bloques.every(b => CAT[(faseId === 'fase_1' && b.ejercicio_fase_1) ? b.ejercicio_fase_1 : b.ejercicio]);
  wrap.appendChild(h('div','sec-title', soloFuerza ? 'Fuerza' : 'Sesión'));
  const grupos = [];
  s.bloques.forEach(b => {
    const letra = String(b.bloque).match(/^[A-Za-zÁÉÍÓÚáéíóú]+/);
    const g = letra ? letra[0] : b.bloque;
    const last = grupos[grupos.length - 1];
    if(last && last.g === g) last.items.push(b);
    else grupos.push({g:g, items:[b]});
  });

  grupos.forEach(grupo => {
    const multi = grupo.items.length > 1;
    const box = h('div', multi ? 'group' : null);
    if(multi){
      const hd = h('div','grouphdr');
      hd.appendChild(h('b', null, (grupo.items.length === 2 ? 'Superserie ' : 'Circuito ') + grupo.g));
      hd.appendChild(h('span', null, grupo.items.length === 2
        ? 'Alterna los dos ejercicios y descansa al terminar la pareja.'
        : 'Encadena los ejercicios y descansa al terminar la vuelta.'));
      box.appendChild(hd);
    }
    grupo.items.forEach(b => {
      const key = (faseId === 'fase_1' && b.ejercicio_fase_1) ? b.ejercicio_fase_1 : b.ejercicio;
      const dose = b[faseId] || '';
      if(CAT[key]) box.appendChild(exerciseCard(key, dose, b.nombre_bloque, b.bloque));
      else box.appendChild(cardioCard(key, dose, b.bloque, faseId, true));
    });
    wrap.appendChild(box);
  });

  /* cardio del día */
  if(s.cardio && s.cardio.formato){
    const c = s.cardio;
    const yaEstaArriba = s.bloques.some(b => b.ejercicio === c.formato);
    wrap.appendChild(h('div','sec-title','Cardio'));
    if(yaEstaArriba){
      wrap.appendChild(note('cardio', 'Es el bloque de arriba',
        'El cardio de hoy es ese mismo bloque: ' + (c[faseId] || '') + ' en total.'));
    } else {
      wrap.appendChild(cardioCard(c.formato, c[faseId] || '', null, faseId, true));
    }
    if(c.nota) wrap.appendChild(note('cardio', 'Nota', c.nota));
  }
}

/* ---------- catálogo ---------- */
function renderCatalog(){
  const wrap = document.getElementById('catalogWrap');
  wrap.innerHTML = '';
  const grupos = [];
  Object.keys(CAT).forEach(k => {
    const g = CAT[k].grupo || 'Otros';
    let e = grupos.find(x => x.g === g);
    if(!e){ e = {g:g, keys:[]}; grupos.push(e); }
    e.keys.push(k);
  });
  grupos.forEach(gr => {
    const t = h('div','sec-title', gr.g);
    t.dataset.group = '1';
    wrap.appendChild(t);
    gr.keys.forEach(k => {
      const c = exerciseCard(k, CAT[k].series_reps_base, null, null);
      c.dataset.name = (CAT[k].nombre + ' ' + CAT[k].objetivo + ' ' + gr.g).toLowerCase();
      wrap.appendChild(c);
    });
  });
  document.getElementById('exSearch').oninput = e => {
    const q = e.target.value.toLowerCase().trim();
    let visiblesEnGrupo = 0, titulo = null;
    [...wrap.children].forEach(c => {
      if(c.dataset.group){
        if(titulo) titulo.hidden = visiblesEnGrupo === 0;
        titulo = c; visiblesEnGrupo = 0; c.hidden = false;
        return;
      }
      const ok = !q || c.dataset.name.indexOf(q) >= 0;
      c.hidden = !ok;
      if(ok) visiblesEnGrupo++;
    });
    if(titulo) titulo.hidden = visiblesEnGrupo === 0;
  };
}

    c.appendChild(h('h3', null, f.nombre));
    c.appendChild(h('div','dose', 'Semanas ' + f.semanas));
    kvRow(c, 'Series', f.series);
    kvRow(c, 'RIR', f.rir);
    kvRow(c, 'Descanso', f.descanso_s + ' s');
    c.appendChild(ul(f.claves));
    wrap.appendChild(c);
  });

  /* progresión */
  wrap.appendChild(h('div','sec-title','Progresión'));
  const pr = h('div','card pad');
  pr.appendChild(h('div','lbl','Doble progresión'));
  pr.appendChild(h('div', null, D.progresion.regla_doble_progresion));
  pr.appendChild(h('div','lbl','Si no hay más peso disponible'));
  pr.appendChild(ul(D.progresion.si_no_hay_mas_peso));
  wrap.appendChild(pr);

  /* nutrición */
  if(D.nutricion){
    wrap.appendChild(h('div','sec-title','Alimentación'));
    const n = h('div','card pad');
    kvRow(n, 'Gasto estimado', D.nutricion.gasto_estimado_kcal + ' kcal');
    kvRow(n, 'Objetivo diario', D.nutricion.calorias_objetivo_kcal + ' kcal');
    kvRow(n, 'Proteína', D.nutricion.proteina_g_dia + ' g/día');
    kvRow(n, 'Ritmo esperado', D.nutricion.ritmo_esperado_kg_semana + ' kg/semana');
    n.appendChild(ul(D.nutricion.reglas));
    n.appendChild(h('div','small', D.nutricion.supuesto));
    wrap.appendChild(n);
  }

  /* seguimiento */
  wrap.appendChild(h('div','sec-title','Seguimiento'));
  const sg = h('div','card pad');
  const SG = D.seguimiento;
  [['Peso','peso'],['Cintura','cintura'],['Ritmo objetivo','ritmo_objetivo'],['Si se estanca','ajuste'],['Si baja demasiado','si_baja_demasiado'],['Registro','registro']].forEach(par => {
    if(SG[par[1]]){ sg.appendChild(h('div','lbl', par[0])); sg.appendChild(h('div', null, SG[par[1]])); }
  });
  const sen = SG['señales_para_reducir_carga'];
  if(sen){ sg.appendChild(h('div','lbl','Señales para reducir carga')); sg.appendChild(ul(sen)); }
  wrap.appendChild(sg);

  /* objetivo y proyección */
  wrap.appendChild(h('div','sec-title','Objetivo y proyección'));
  const ob = h('div','card pad');
  kvRow(ob, 'Peso inicial → objetivo', D.perfil.peso_inicial_kg + ' → ' + D.perfil.peso_objetivo_kg + ' kg');
  kvRow(ob, 'Plazo del plan', D.objetivo.plazo_semanas + ' semanas');
  kvRow(ob, 'Ritmo que exigiría', D.objetivo.ritmo_requerido_kg_semana + ' kg/semana');
  const pj = D.objetivo.proyeccion_realista;
  if(pj){
    kvRow(ob, 'Ritmo sostenible', pj.ritmo_sostenible_kg_semana + ' kg/semana');
    kvRow(ob, 'Peso estimado en la semana 8', pj.peso_estimado_semana_8_kg + ' kg');
    kvRow(ob, 'Llegada a 70 kg', 'semana ' + pj.semana_estimada_70_kg);
  }
  wrap.appendChild(ob);
  if(D.objetivo.nota) wrap.appendChild(note('warn', 'Expectativa realista', D.objetivo.nota));

  if(D.proyeccion){
    const tb = h('div','card pad');
    tb.appendChild(h('div','lbl','Proyección de peso'));
    const tab = h('div','table');
    const head = h('div','trow th');
    head.appendChild(h('span', null, 'Semana'));
    head.appendChild(h('span', null, 'Conservador'));
    head.appendChild(h('span', null, 'Bueno'));
    tab.appendChild(head);
    D.proyeccion.forEach(r => {
      const tr = h('div','trow' + (r.semana === week ? ' on' : ''));
      tr.appendChild(h('span', null, String(r.semana)));
      tr.appendChild(h('span', null, r.conservador_kg + ' kg'));
      tr.appendChild(h('span', null, r.bueno_kg + ' kg'));
      tab.appendChild(tr);
    });
    tb.appendChild(tab);
    if(D.proyeccion_supuestos) tb.appendChild(h('div','small', D.proyeccion_supuestos));
    wrap.appendChild(tb);
  }

  /* perfil */
  wrap.appendChild(h('div','sec-title','Perfil y equipo'));
  const pf = h('div','card pad');
  kvRow(pf, 'Altura', D.perfil.altura_m + ' m');
  kvRow(pf, 'IMC inicial', D.perfil.imc_inicial);
  kvRow(pf, 'Días por semana', D.perfil.dias_entrenamiento_semana);
  kvRow(pf, 'Sesión', D.perfil.disponibilidad_diaria_min.min + '-' + D.perfil.disponibilidad_diaria_min.max + ' min');
  pf.appendChild(h('div','lbl','Equipamiento'));
  pf.appendChild(ul(D.perfil.equipamiento));
  if(D.perfil.modos_del_kit){
    pf.appendChild(h('div','lbl','Modos del kit'));
    Object.keys(D.perfil.modos_del_kit).forEach(k => kvRow(pf, k.replace(/_/g,' '), D.perfil.modos_del_kit[k]));
  }
  if(D.perfil.orden_de_modos_por_dia){
    pf.appendChild(h('div','lbl','Orden de montaje por día'));
    Object.keys(D.perfil.orden_de_modos_por_dia).forEach(k => kvRow(pf, k, D.perfil.orden_de_modos_por_dia[k]));
  }
  pf.appendChild(h('div','lbl','Limitaciones'));
  pf.appendChild(ul(D.perfil.limitaciones));
  wrap.appendChild(pf);

  /* novedades */
  if(D.cambios_vs_v1){
    wrap.appendChild(h('div','sec-title','Qué cambió respecto a la versión 1'));
    const cv = h('div','card pad');
    D.cambios_vs_v1.forEach(c => {
      const r = h('div','change');
      r.appendChild(h('s', null, c.antes));
      r.appendChild(h('div', null, c.ahora));
      cv.appendChild(r);
    });
    wrap.appendChild(cv);
  }
}

/* ---------- navegación ---------- */
document.querySelectorAll('.tab').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b === btn));
    document.querySelectorAll('.view').forEach(v => v.hidden = (v.id !== 'view-' + btn.dataset.view));
    window.scrollTo({top:0});
  };
});

const themeBtn = document.getElementById('themeBtn');
const saved = store.get('rutina-theme');
if(saved) document.documentElement.setAttribute('data-theme', saved);
themeBtn.onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : !window.matchMedia('(prefers-color-scheme: light)').matches;
  const next = dark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  store.set('rutina-theme', next);
};

document.getElementById('hdrTitle').textContent = D.perfil.peso_inicial_kg + ' → ' + D.perfil.peso_objetivo_kg + ' kg';
document.getElementById('foot').textContent = D.titulo + ' · v' + D.version;
renderStrips();
renderSession();
renderCatalog();
renderCardio();
renderGuia();
document.querySelectorAll('#weekStrip .pill')[week-1].scrollIntoView({inline:'center', block:'nearest'});

/* Funcionamiento sin conexion cuando se abre desde una URL (GitHub Pages).
   Se ignora al abrir el archivo directamente con file://. */
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
